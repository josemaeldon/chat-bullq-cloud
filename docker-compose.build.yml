# Override para desenvolvimento/build local.
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build

services:
  backend:
    image: chat-bullq-cloud-backend:local
    pull_policy: build
    build:
      context: ./backend
      dockerfile: Dockerfile

  frontend:
    image: chat-bullq-cloud-frontend:local
    pull_policy: build
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        INTERNAL_API_URL: http://backend:3001
