services:

## --------------------------- CHAT BULLQ --------------------------- ##

  web:
    image: chat-bullq-web:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # O navegador chama o mesmo dominio do frontend.
        NEXT_PUBLIC_API_URL: /api/v1
        # ALTERE "backend" caso o servico da API tenha outro nome na rede.
        INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:3001}

    environment:
      - NEXT_PUBLIC_API_URL=/api/v1
      - INTERNAL_API_URL=${INTERNAL_API_URL:-http://backend:3001}

    networks:
      - bullqnet

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=1
        # ALTERE somente o dominio do frontend; a API passa pelo proxy interno.
        - traefik.http.routers.chat-bullq.rule=Host(`chat.seudominio.com`)
        - traefik.http.routers.chat-bullq.entrypoints=websecure
        - traefik.http.routers.chat-bullq.priority=1
        - traefik.http.routers.chat-bullq.tls.certresolver=letsencryptresolver
        - traefik.http.routers.chat-bullq.service=chat-bullq
        - traefik.http.services.chat-bullq.loadbalancer.server.port=3000
        - traefik.http.services.chat-bullq.loadbalancer.passHostHeader=true

## --------------------------- CHAT BULLQ --------------------------- ##

networks:
  bullqnet:
    external: true
    name: bullqnet
