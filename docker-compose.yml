services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bravy
      POSTGRES_PASSWORD: bravy123
      POSTGRES_DB: chat_bullq
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bravy -d chat_bullq']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: bravy
      MINIO_ROOT_PASSWORD: bravy123minio
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://bravy:bravy123@postgres:5432/chat_bullq
      JWT_SECRET: change-me-generate-with-node-e-require-crypto-randomBytes-64-toString-hex
      JWT_EXPIRATION: 15m
      JWT_REFRESH_SECRET: change-me-generate-another-different-one
      JWT_REFRESH_EXPIRATION: 7d
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ORIGIN: http://localhost:3000
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: bravy
      MINIO_SECRET_KEY: bravy123minio
      MINIO_BUCKET: chat-bullq
      OPENAI_API_KEY: sk-proj-your-key-here
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - '3001:3001'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
    depends_on:
      - backend
    ports:
      - '3000:3000'

volumes:
  postgres_data:
  minio_data:
