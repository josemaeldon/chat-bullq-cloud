# Chat BullQ - stack Docker Compose
#
# Antes de subir:
#   1. copie `.env.example` para `.env`;
#   2. altere todos os valores marcados com CHANGE_ME;
#   3. em producao, configure PUBLIC_URL com HTTPS.
#
# As imagens sao publicadas automaticamente no GHCR pelo GitHub Actions.
# O backend executa `prisma migrate deploy` automaticamente ao iniciar.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # ALTERE em producao. Estes valores precisam corresponder ao DATABASE_URL.
      POSTGRES_USER: ${POSTGRES_USER:-chat_bullq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_DATABASE_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-chat_bullq}
    # Disponivel somente na rede exclusiva da stack como postgres:5432.
    expose:
      - '5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Disponivel somente na rede exclusiva da stack como redis:6379.
    expose:
      - '6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      # ALTERE em producao. A senha deve ter pelo menos 8 caracteres.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-chat_bullq}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-CHANGE_ME_MINIO_PASSWORD}
    # API e console ficam restritos a rede Docker da stack.
    expose:
      - '9000'
      - '9001'
    volumes:
      - minio_data:/data

  backend:
    # ALTERE BACKEND_IMAGE apenas ao usar fork, outro registry ou tag fixa.
    image: ${BACKEND_IMAGE:-ghcr.io/josemaeldon/chat-bullq-cloud-backend:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001

      # ALTERE se mudar usuario, senha ou banco do PostgreSQL.
      # Senhas com caracteres especiais precisam estar codificadas para URL.
      DATABASE_URL: ${DATABASE_URL:-postgresql://chat_bullq:CHANGE_ME_DATABASE_PASSWORD@postgres:5432/chat_bullq}

      # ALTERE obrigatoriamente. Use dois segredos longos e diferentes.
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-CHANGE_ME_JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}

      # Nomes internos da rede Docker. Normalmente nao devem ser alterados.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}

      # O navegador acessa tudo pelo frontend; esta e a unica origem publica.
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost:3000}

      # URL externa apenas para callbacks/webhooks. As requisicoes normais
      # frontend -> backend trafegam pela rede interna, sem dominio.
      APP_URL: ${PUBLIC_URL:-http://localhost:3000}

      # Uploads locais ficam no volume backend_uploads.
      UPLOADS_DIR: /app/uploads

      # MinIO esta disponivel na stack para evolucao do armazenamento.
      # O upload padrao atual continua persistido em backend_uploads.
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-chat_bullq}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-CHANGE_ME_MINIO_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-chat-bullq}

      # Opcional, mas necessario para recursos de IA e embeddings.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      # Recuperacao de senha por e-mail. Configure todos em producao.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}

      # Opcionais: notificacoes push.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    # Backend nao e publicado no host. O frontend o acessa por backend:3001.
    expose:
      - '3001'
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    # ALTERE FRONTEND_IMAGE apenas ao usar fork, outro registry ou tag fixa.
    image: ${FRONTEND_IMAGE:-ghcr.io/josemaeldon/chat-bullq-cloud-frontend:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      INTERNAL_API_URL: http://backend:3001
    depends_on:
      - backend
    ports:
      - '${FRONTEND_PORT:-3000}:3000'

volumes:
  # Nao use `docker compose down -v` em producao: ele remove estes dados.
  postgres_data:
  minio_data:
  backend_uploads:

networks:
  default:
    # Rede exclusiva da aplicacao. Outros containers nao entram nela
    # automaticamente, mesmo que existam no mesmo servidor Portainer.
    name: ${DOCKER_NETWORK_NAME:-chat-bullq-cloud-internal}
    driver: bridge
