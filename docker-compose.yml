version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chat_bullq
      POSTGRES_PASSWORD: CHANGE_ME
      POSTGRES_DB: chat_bullq
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chat_bullq_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_bullq -d chat_bullq"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  redis:
    image: redis:7-alpine
    networks:
      - chat_bullq_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: chat_bullq
      MINIO_ROOT_PASSWORD: M9pL2xQ7vR4sT8yH3nK6bZ1cD5aF0g
    volumes:
      - minio_data:/data
    networks:
      - chat_bullq_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  minio-init:
    image: minio/mc:latest
    networks:
      - chat_bullq_internal
    entrypoint: >
      /bin/sh -c "
      sleep 15;
      mc alias set local http://minio:9000 chat_bullq M9pL2xQ7vR4sT8yH3nK6bZ1cD5aF0g;
      mc mb -p local/chat-bullq || true;
      mc anonymous set download local/chat-bullq || true;
      exit 0;
      "
    deploy:
      replicas: 1
      restart_policy:
        condition: none

  backend:
    image: ghcr.io/josemaeldon/chat-bullq-cloud-backend:latest
    environment:
      NODE_ENV: production
      PORT: 3001

      DATABASE_URL: postgresql://chat_bullq:CHANGE_ME@postgres:5432/chat_bullq

      JWT_SECRET: qJ8vN4mS7xD2pL9tR5cY1hB6wK3zA0fG
      JWT_EXPIRATION: 15m
      JWT_REFRESH_SECRET: zR6mT1xQ9vB4pK8yH2cN7sL5dF0aG3jW
      JWT_REFRESH_EXPIRATION: 7d

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""

      CORS_ORIGIN: https://chatgo.cloudbr.app
      APP_URL: https://chatgo.cloudbr.app

      UPLOADS_DIR: /app/uploads

      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: chat_bullq
      MINIO_SECRET_KEY: M9pL2xQ7vR4sT8yH3nK6bZ1cD5aF0g
      MINIO_BUCKET: chat-bullq

      OPENAI_API_KEY: ""

      SMTP_HOST: ""
      SMTP_PORT: 587
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: ""

      VAPID_PUBLIC_KEY: ""
      VAPID_PRIVATE_KEY: ""
      VAPID_SUBJECT: mailto:admin@example.com
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - chat_bullq_internal
      - luzianet
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      update_config:
        order: start-first
      labels:
        - traefik.enable=true
        - traefik.docker.network=luzianet

        - traefik.http.routers.chat-bullq-socket.rule=Host(`chatgo.cloudbr.app`) && PathPrefix(`/socket.io`)
        - traefik.http.routers.chat-bullq-socket.entrypoints=websecure
        - traefik.http.routers.chat-bullq-socket.tls=true
        - traefik.http.routers.chat-bullq-socket.tls.certresolver=letsencryptresolver
        - traefik.http.routers.chat-bullq-socket.service=chat-bullq-backend
        - traefik.http.routers.chat-bullq-socket.priority=100

        - traefik.http.services.chat-bullq-backend.loadbalancer.server.port=3001
        - traefik.http.services.chat-bullq-backend.loadbalancer.passHostHeader=true

  frontend:
    image: ghcr.io/josemaeldon/chat-bullq-cloud-frontend:latest
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api/v1
      INTERNAL_API_URL: http://backend:3001
    networks:
      - chat_bullq_internal
      - luzianet
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      update_config:
        order: start-first
      labels:
        - traefik.enable=true
        - traefik.docker.network=luzianet

        - traefik.http.routers.chat-bullq.rule=Host(`chatgo.cloudbr.app`)
        - traefik.http.routers.chat-bullq.entrypoints=websecure
        - traefik.http.routers.chat-bullq.tls=true
        - traefik.http.routers.chat-bullq.tls.certresolver=letsencryptresolver
        - traefik.http.routers.chat-bullq.service=chat-bullq

        - traefik.http.services.chat-bullq.loadbalancer.server.port=3000
        - traefik.http.services.chat-bullq.loadbalancer.passHostHeader=true

volumes:
  postgres_data:
  minio_data:
  backend_uploads:

networks:
  chat_bullq_internal:
    driver: overlay
    attachable: true

  luzianet:
    external: true
